<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facturación Electrónica - Grupo 5</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="mb-0 text-primary fw-bold">Plataforma de Facturación Electrónica</h1>
      <div>
        <a href="api-list.html" class="btn btn-outline-secondary btn-sm" target="_blank">Ver API (JSON)</a>
      </div>
    </div>
    <div class="row mb-4">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Facturas por Empresa</h4>
          </div>
          <div class="card-body">
            <select id="empresaSelect" class="form-select mb-3"></select>
            <button class="btn btn-primary mb-3 w-100" onclick="cargarFacturasEmpresa()">Ver Facturas</button>
            <table class="table table-bordered table-hover" id="tablaFacturasEmpresa">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Fecha</th>
                  <th>Subtotal</th>
                  <th>Impuestos</th>
                  <th>Total</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-header bg-success text-white">
            <h4 class="mb-0">Facturación Mensual</h4>
          </div>
          <div class="card-body">
            <button class="btn btn-success mb-3 w-100" onclick="cargarFacturacionMensual()">Ver Facturación Mensual</button>
            <table class="table table-bordered table-hover" id="tablaMensual">
              <thead class="table-light">
                <tr>
                  <th>Mes</th>
                  <th>Total</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div class="row mt-4">
      <div class="col-md-8 offset-md-2">
        <div class="card shadow-sm">
          <div class="card-header bg-info text-white">
            <h4 class="mb-0">Total de Facturación por Empresa</h4>
          </div>
          <div class="card-body">
            <select id="empresaTotalSelect" class="form-select mb-3"></select>
            <button class="btn btn-info mb-3 w-100" onclick="cargarTotalPorEmpresa()">Ver Total</button>
            <div id="totalFactura" class="alert alert-secondary text-center fw-bold"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
